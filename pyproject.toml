[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binwalk-gui"
version = "0.1.0"
description = "Nowoczesne GUI w PyQt6 dla narzędzia Binwalk v2.4.3 z obsługą wszystkich opcji CLI i szybkim rozpakowywaniem plików .bin"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4",
]

[project.scripts]
binwalk-gui = "binwalk_gui.ui.main_window:run_app"
